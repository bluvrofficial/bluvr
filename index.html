<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLUVR</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Space Grotesk',sans-serif;

background:#ffffff;

color:#111;

overflow-x:hidden;

}

.hero{

height:100vh;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

text-align:center;

padding:30px;

}

.logo{

width:180px;

margin-bottom:35px;

animation:float 4s ease-in-out infinite;

}

h1{

font-size:68px;

font-weight:700;

letter-spacing:-3px;

}

h2{

margin-top:20px;

font-size:24px;

font-weight:500;

color:#0052FF;

}

p{

margin-top:18px;

font-size:18px;

max-width:650px;

line-height:1.8;

color:#666;

}

.button{

margin-top:45px;

display:inline-block;

padding:16px 36px;

background:#0052FF;

color:white;

text-decoration:none;

border-radius:999px;

font-weight:700;

transition:.25s;

}

.button:hover{

transform:translateY(-2px);

box-shadow:0 10px 30px rgba(0,82,255,.25);

}

footer{

padding:60px;

text-align:center;

font-size:14px;

color:#777;

}

@keyframes float{

0%{transform:translateY(0);}

50%{transform:translateY(-12px);}

100%{transform:translateY(0);}

}

</style>

</head>

<body>

<section class="hero">

<img src="assets/mascot.png" class="logo">

<h1>BLUVR</h1>

<h2>The Blue Never Stops Building.</h2>

<p>

Built for the blue chain.<br>

Still Building. 🔵

</p>

<a class="button"

href="https://x.com/BLUVRxyz"

target="_blank">

Follow on X

</a>

</section>

<footer>

© 2026 BLUVR • Built on Base.

</footer>

</body>

</html>
